<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naruto NX Installer</title>
<link rel="icon" href="icons/icon-192.png">
<style>
  :root { --bg:#14171A; --panel:#1C2024; --text:#E6E1D3; --muted:#B9B4A6; --faint:#948F84; --signal:#5CA382; --slate:#7FA0B4; --ochre:#C2AC63; --bad:#d97a6c; }
  :root[data-theme="light"] { --bg:#E6E1D3; --panel:#EFEBDF; --text:#16191C; --muted:#4A4E52; --faint:#5A5E62; --signal:#22683F; --slate:#2F4858; --ochre:#71622B; --bad:#9b3a2c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.55 "IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  header { display:flex; gap:18px; align-items:center; border:1px solid color-mix(in srgb,var(--text) 35%,transparent); padding:16px; background:var(--panel); }
  header img { width:84px; height:84px; image-rendering:auto; border:1px solid color-mix(in srgb,var(--text) 35%,transparent); }
  h1 { margin:0; font-size:26px; font-weight:600; }
  .kicker { color:var(--signal); font:600 13px/1 "IBM Plex Mono",Consolas,monospace; letter-spacing:2px; margin-bottom:6px; }
  .langs { margin-left:auto; display:flex; gap:6px; align-self:flex-start; }
  .langs button { background:none; color:var(--muted); border:1px solid color-mix(in srgb,var(--text) 35%,transparent); padding:2px 8px; cursor:pointer; font:inherit; font-size:13px; }
  .langs button[aria-pressed="true"] { color:var(--bg); background:var(--slate); border-color:var(--slate); }
  section { margin-top:22px; }
  h2 { font-size:15px; font-weight:600; color:var(--signal); text-transform:uppercase; letter-spacing:1.5px; margin:0 0 8px; }
  p, li { color:var(--muted); }
  code { font-family:"IBM Plex Mono",Consolas,monospace; font-size:14px; color:var(--text); }
  .box { background:var(--panel); border:1px solid color-mix(in srgb,var(--text) 25%,transparent); padding:14px; }
  button.main { background:var(--signal); color:var(--bg); border:0; padding:10px 18px; font:600 16px/1 inherit; cursor:pointer; }
  button.main:disabled { opacity:.45; cursor:default; }
  input[type=file] { color:var(--muted); }
  .status { margin-top:10px; font-weight:600; }
  .good { color:var(--signal); } .bad { color:var(--bad); }
  .bar { height:8px; background:color-mix(in srgb,var(--text) 15%,transparent); margin-top:12px; }
  .bar div { height:100%; width:0; background:var(--signal); transition:width .2s; }
  #log { font:13px/1.5 "IBM Plex Mono",Consolas,monospace; color:var(--faint); margin-top:10px; white-space:pre-wrap; }
  footer { margin-top:32px; color:var(--faint); font-size:13px; }
  a { color:var(--slate); }
  @media (max-width:520px) { header { flex-wrap:wrap; } .langs { margin-left:0; } }
</style>
</head>
<body>
<main>
  <header>
    <img src="icons/icon-192.png" alt="">
    <div><div class="kicker" data-t="kicker"></div><h1>Naruto: Rise of a Ninja</h1><div style="color:var(--muted)" data-t="subtitle"></div></div>
    <div class="langs"><button data-lang="en">EN</button><button data-lang="ru">RU</button></div>
  </header>
  <section><h2 data-t="whatTitle"></h2><p data-t="what"></p></section>
  <section>
    <h2 data-t="step1"></h2>
    <div class="box">
      <p data-t="step1Text" style="margin-top:0"></p>
      <input type="file" id="folder" webkitdirectory directory multiple>
      <div class="status" id="status"></div>
    </div>
  </section>
  <section>
    <h2 data-t="step2"></h2>
    <div class="box">
      <button class="main" id="create" disabled data-t="create"></button>
      <div class="bar"><div id="bar"></div></div>
      <div id="log"></div>
    </div>
  </section>
  <section><h2 data-t="step3"></h2><ol id="steps"></ol></section>
  <footer data-t-html="footer"></footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
