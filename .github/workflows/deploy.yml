name: Deploy to GitHub Pages

# The NRO is not in this repository: it is the naruto.nro asset of a release of malinkin-s/naruto-rise-of-a-ninja-nx.
# Each deployment downloads it into release/, checks its SHA-256 against release/manifest.json and publishes the page
# with it. Run it by hand (Actions > Deploy to GitHub Pages > Run workflow) after publishing a new release there.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release of naruto-rise-of-a-ninja-nx to take the NRO from (empty for the latest)
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the NRO of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download $TAG --repo malinkin-s/naruto-rise-of-a-ninja-nx --pattern 'naruto.nro' --dir release --clobber

      - name: Check it against the list of builds
        run: |
          want=$(node -e "console.log(require('./release/manifest.json').builds.map(b => b.nro_sha256).join(' '))")
          have=$(sha256sum release/naruto.nro | cut -d' ' -f1)
          echo "naruto.nro $have"; case " $want " in *" $have "*) ;; *) echo "not a build of the manifest"; exit 1;; esac

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html app.js naruto_worker.js icons renut_shader_common.h lib wasm release _site/
          rm -rf _site/wasm/src

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
